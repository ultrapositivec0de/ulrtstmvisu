<!DOCTYPE html>
<html>
<body>
<div id="test">Hello <b>World</b>!</div>
<script>
  const el = document.getElementById('test');
  const range = document.createRange();
  range.setStart(el.firstChild, 3); // "Hel"
  range.setEnd(el.childNodes[1].firstChild, 2); // "Wo"
  
  const startNode = range.startContainer;
  const startOffset = range.startOffset;
  const endNode = range.endContainer;
  const endOffset = range.endOffset;
  
  if (startNode === endNode && startNode.nodeType === Node.TEXT_NODE) {
      const text = startNode.nodeValue;
      startNode.nodeValue = text.slice(0, startOffset) + '\x01' + text.slice(startOffset, endOffset) + '\x02' + text.slice(endOffset);
  } else {
      if (endNode.nodeType === Node.TEXT_NODE) {
          const text = endNode.nodeValue;
          endNode.nodeValue = text.slice(0, endOffset) + '\x02' + text.slice(endOffset);
      } else {
          endNode.insertBefore(document.createTextNode('\x02'), endNode.childNodes[endOffset]);
      }
      
      if (startNode.nodeType === Node.TEXT_NODE) {
          const text = startNode.nodeValue;
          startNode.nodeValue = text.slice(0, startOffset) + '\x01' + text.slice(startOffset);
      } else {
          startNode.insertBefore(document.createTextNode('\x01'), startNode.childNodes[startOffset]);
      }
  }
  console.log(el.innerHTML);
</script>
</body>
</html>
