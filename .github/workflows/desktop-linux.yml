name: "Desktop Build (Linux)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: "Validate Packages, Types & Lint"
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout code repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: "Install Frontend Dependencies"
        run: npm install --legacy-peer-deps

      - name: "Run Linting"
        run: npm run lint

      - name: "Build Frontend (Typecheck & Compile)"
        run: npm run build

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu latest)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @tauri-apps/cli tsx jimp@0.22.12

      - name: Generate Icons
        run: npm run icon

      - name: Build Web
        run: npm run build

      - name: Build Desktop (Linux)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
