name: NeutralinoJS Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Wait for binaries
        run: |
          cd neutralino-build
          npx --yes @neutralinojs/neu update

      - name: Build Neutralino App
        run: npm run build:neu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteemEditorPro-Neutralino
          path: neutralino-build/dist/
