name: NeutralinoJS Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Wait for binaries
        run: |
          cd neutralino-build
          npx --yes @neutralinojs/neu update

      - name: Build Neutralino App
        run: npm run build:neu

      - name: Get package version
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Neutralino Release Artifact
        shell: bash
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          DIST_DIR="neutralino-build/dist"
          if [ -d "$DIST_DIR" ]; then
            cd "$DIST_DIR"
            if [ -f "ultra-steem-editor-release.zip" ]; then
              mv -f "ultra-steem-editor-release.zip" "ultra-steem-editor-v${VERSION}-neutralino.zip"
              rm -f ultra-steem-editor-*-release.zip
              echo "Created versioned Neutralino release artifact:"
              ls -la "ultra-steem-editor-v${VERSION}-neutralino.zip"
            fi
          fi

      - name: Upload Neutralino Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.package-version.outputs.version }}"
          name: "Release v${{ steps.package-version.outputs.version }}"
          draft: true
          files: |
            neutralino-build/dist/ultra-steem-editor-v${{ steps.package-version.outputs.version }}-neutralino.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
