name: 2 NeutralinoJS Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and system utilities
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip
          npm install

      - name: Wait for binaries
        run: |
          cd neutralino-build
          npx --yes @neutralinojs/neu update

      - name: Build Neutralino App
        run: npm run build:neu

      - name: Get package version
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Neutralino Release Artifact
        shell: bash
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          DIST_DIR="neutralino-build/dist"
          TARGET_FILE="$DIST_DIR/ultra-steem-editor-v${VERSION}-neutralino.zip"

          echo "🔍 Inspecting $DIST_DIR contents:"
          if [ -d "$DIST_DIR" ]; then
            ls -la "$DIST_DIR"
          else
            echo "❌ Directory $DIST_DIR does not exist!"
            exit 1
          fi

          if [ -f "$TARGET_FILE" ]; then
            echo "✅ Target artifact ready: $TARGET_FILE"
            ls -la "$TARGET_FILE"
          else
            # Search for any existing .zip file in $DIST_DIR
            ANY_ZIP=$(find "$DIST_DIR" -type f -name "*.zip" | head -n 1)
            if [ -n "$ANY_ZIP" ]; then
              echo "📦 Found zip file: $ANY_ZIP -> Copying to $TARGET_FILE"
              cp -f "$ANY_ZIP" "$TARGET_FILE"
              ls -la "$TARGET_FILE"
            else
              echo "❌ No zip artifact found in $DIST_DIR after build step!"
              exit 1
            fi
          fi

      - name: Upload Neutralino Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.package-version.outputs.version }}"
          name: "Release v${{ steps.package-version.outputs.version }}"
          draft: true
          files: |
            neutralino-build/dist/ultra-steem-editor-v${{ steps.package-version.outputs.version }}-neutralino.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
