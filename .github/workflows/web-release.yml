name: "Build & Release Web (Static Page)"

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Grant permissions for creating/updating GitHub Releases
permissions:
  contents: write

jobs:
  build-web:
    name: "Build & Release Static Web ZIP"
    runs-on: ubuntu-26.04

    steps:
      - name: "Checkout code repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: "Install Frontend Dependencies"
        run: npm install --legacy-peer-deps

      - name: "Build Static Frontend Assets"
        run: npm run build

      - name: "Get package metadata"
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name.replace(/[^a-zA-Z0-9._-]+/g, '-')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: "Compress built assets into ZIP"
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          PKG_NAME="${{ steps.package-version.outputs.name }}"
          cd dist
          zip -r ../${PKG_NAME}-web-v${VERSION}.zip .

      - name: "Upload Static Web ZIP to GitHub Draft Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.package-version.outputs.version }}"
          name: "Release v${{ steps.package-version.outputs.version }}"
          draft: true
          prerelease: false
          files: |
            ${{ steps.package-version.outputs.name }}-web-v${{ steps.package-version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

