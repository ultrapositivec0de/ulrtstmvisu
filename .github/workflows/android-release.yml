name: "Tauri Android Build & Release"

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags
  workflow_dispatch: # Allows manual trigger for Android specifically

permissions:
  contents: write

jobs:
  publish-android:
    name: "Build & Release (Android)"
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout code repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: "Setup Java (JDK 24)"
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "24"

      - name: "Install Rust stable toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"

      - name: "Rust Cache"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: "Install dependencies (NDK/SDK tools if needed)"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: "Set up Android SDK and NDK paths"
        run: |
          # 1. Check if ANDROID_NDK_LATEST_HOME is pre-set and exists
          if [ ! -z "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Using system pre-configured ANDROID_NDK_LATEST_HOME: $ANDROID_NDK_LATEST_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
            exit 0
          fi

          # 2. Check if ANDROID_NDK_HOME is pre-set and exists
          if [ ! -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "Using system pre-configured ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
            exit 0
          fi

          # 3. Find latest NDK in typical directories
          FOUND_NDK=""
          POSSIBLE_NDK_PARENTS=(
            "$ANDROID_HOME/ndk"
            "/usr/local/lib/android/sdk/ndk"
            "/usr/local/share/android-sdk/ndk"
            "/home/runner/Android/Sdk/ndk"
          )

          for PARENT in "${POSSIBLE_NDK_PARENTS[@]}"; do
            if [ -d "$PARENT" ]; then
              LATEST_SUBDIR=$(ls -1 "$PARENT" | sort -V | tail -n 1)
              if [ ! -z "$LATEST_SUBDIR" ] && [ -d "$PARENT/$LATEST_SUBDIR" ]; then
                FOUND_NDK="$PARENT/$LATEST_SUBDIR"
                break
              fi
            fi
          done

          if [ ! -z "$FOUND_NDK" ]; then
            echo "Detected NDK at path: $FOUND_NDK"
            echo "ANDROID_NDK_HOME=$FOUND_NDK" >> $GITHUB_ENV
            echo "NDK_HOME=$FOUND_NDK" >> $GITHUB_ENV
          else
            echo "No pre-installed NDK found. Installing NDK 26.3.11579264..."
            # Try installing with sdkmanager (use root/sudo if needed or normal user)
            if [ -w "$ANDROID_HOME" ]; then
              sdkmanager --install "ndk;26.3.11579264"
            else
              sudo sdkmanager --install "ndk;26.3.11579264" || sdkmanager --install "ndk;26.3.11579264"
            fi
            
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
            if [ ! -d "$NDK_PATH" ]; then
              # Look if it got installed elsewhere under ndk parent
              NDK_PARENT="$ANDROID_HOME/ndk"
              LATEST_SUBDIR=$(ls -1 "$NDK_PARENT" | sort -V | tail -n 1)
              if [ ! -z "$LATEST_SUBDIR" ]; then
                NDK_PATH="$NDK_PARENT/$LATEST_SUBDIR"
              fi
            fi
            
            echo "Installed NDK is at: $NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          fi

      - name: "Install Frontend Dependencies"
        run: npm install --legacy-peer-deps

      - name: "Regenerate Icons"
        run: npx tsx generate_png.js && npx tauri icon app-icon.png

      - name: "Initialize Tauri Android Project"
        run: npx tauri android init

      - name: "Configure Android Manifest Permissions"
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          
          # --- PERMISSION CHEAT SHEET (To add, use metadata.json -> requestFramePermissions) ---
          # INTERNET              -> Basic web/API access (Included by default)
          # CAMERA                -> Photos and QR scanning
          # RECORD_AUDIO          -> Microphone access
          # ACCESS_FINE_LOCATION  -> GPS (high accuracy)
          # ACCESS_COARSE_LOCATION -> Network-based location
          #
          # STORAGE (Android 12 and below):
          # READ_EXTERNAL_STORAGE  -> Read documents/photos
          # WRITE_EXTERNAL_STORAGE -> Save documents
          #
          # MEDIA (Android 13+ / API 33+):
          # READ_MEDIA_IMAGES -> Permission for photos only
          # READ_MEDIA_VIDEO  -> Permission for videos only
          # READ_MEDIA_AUDIO  -> Permission for audio only
          # ------------------------------------------------------------------------------------

          # 1. READ permissions from metadata.json (handling multi-line)
          RAW_PERMS=$(cat metadata.json | tr -d '\n' | grep -oP '(?<="requestFramePermissions":\[).*?(?=\])' | tr -d '" ' | tr ',' ' ')
          
          # 2. Add defaults & Map frontend names to Android format
          PERMISSIONS="INTERNET READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES"
          for P in $RAW_PERMS; do
            UPPER_P=$(echo $P | tr '[:lower:]' '[:upper:]')
            PERMISSIONS="$PERMISSIONS $UPPER_P"
          done
          
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Updating Android Manifest at $MANIFEST_PATH"
            # Wipe existing permissions to avoid duplicates
            sed -i '/android.permission./d' "$MANIFEST_PATH"
            
            # 3. Inject unique sorted permissions before <application>
            INJECT=""
            for P in $(echo $PERMISSIONS | tr ' ' '\n' | sort -u); do
              INJECT="${INJECT}    <uses-permission android:name=\"android.permission.${P}\" />\n"
            done
            
            sed -i "/<application/i $INJECT" "$MANIFEST_PATH"
            echo "Successfully updated manifest with: $PERMISSIONS"
          else
            echo "Skipping: Android manifest not found at $MANIFEST_PATH (Wait for Tauri to generate it)"
          fi

      - name: "Configure Release Build Signing with Debug Key"
        shell: python
        run: |
          import os
          path = "src-tauri/gen/android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if 'signingConfig = signingConfigs.getByName("debug")' not in content:
                  content = content.replace('getByName("release") {', 'getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")')
                  with open(path, "w") as f:
                      f.write(content)
                  print("Successfully patched build.gradle.kts to use debug signing key.")
              else:
                  print("build.gradle.kts was already patched.")
          else:
              print("Error: build.gradle.kts not found!")
              exit(1)

      - name: "Build Frontend"
        run: npm run build

      - name: "Build Android APK & AAB"
        run: npx tauri android build --apk --split-per-abi

      - name: "Get package version"
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "Upload Android Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
