name: "Tauri Android Build & Release"

on:
  workflow_dispatch: # Allows manual trigger for Android specifically

permissions:
  contents: write

jobs:
  validate:
    name: "Validate Packages, Types & Lint"
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout code repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: "Verify Tauri & Crate Versions"
        run: npm run check:tauri

      - name: "Install Rust stable toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Verify Cargo Dependency Resolution"
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: "Install Frontend Dependencies"
        run: npm install --legacy-peer-deps

      - name: "Run Linting"
        run: npm run lint

      - name: "Build Frontend (Typecheck & Compile)"
        run: npm run build

  publish-android:
    name: "Build & Release (Android)"
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout code repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: "Setup Java (JDK 24)"
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "24"

      - name: "Install Rust stable toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"

      - name: "Rust Cache"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: "Install dependencies (NDK/SDK tools if needed)"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: "Install Frontend Dependencies"
        run: npm install --legacy-peer-deps

      - name: "Initialize Tauri Android Project"
        run: npx tauri android init

      - name: "Regenerate Icons"
        run: |
          ICON_PATH="app-icon.png"
          if [ -f "src-tauri/app-icon.png" ]; then
            ICON_PATH="src-tauri/app-icon.png"
          elif [ -f "src-tauri/icons/icon.png" ]; then
            ICON_PATH="src-tauri/icons/icon.png"
          fi
          echo "Generating icons from $ICON_PATH..."
          npx tauri icon "$ICON_PATH"

      - name: "Configure Android Manifest Permissions"
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          
          # --- PERMISSION CHEAT SHEET (SAF-First & Least-Privilege Policy) ---
          # INTERNET               -> Basic web/API access (Included by default)
          # CAMERA                 -> Photos and QR scanning (Optional via metadata.json)
          # RECORD_AUDIO           -> Microphone access (Optional via metadata.json)
          # ACCESS_FINE_LOCATION   -> GPS high accuracy (Optional via metadata.json)
          # ACCESS_COARSE_LOCATION -> Network location (Optional via metadata.json)
          #
          # File export/import (.md, .zip, .json) and media picking use Android SAF
          # (Storage Access Framework) & Photo Picker via system intents.
          # Legacy/broad storage permissions (EXTERNAL_STORAGE / MEDIA_*) are excluded.
          # ------------------------------------------------------------------------------------

          # 1. READ permissions from metadata.json (handling multi-line)
          RAW_PERMS=$(cat metadata.json | tr -d '\n' | grep -oP '(?<="requestFramePermissions":\[).*?(?=\])' | tr -d '" ' | tr ',' ' ')
          
          # 2. Add strict defaults & exclude broad external storage permissions (SAF handles files)
          PERMISSIONS="INTERNET"
          for P in $RAW_PERMS; do
            UPPER_P=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            case "$UPPER_P" in
              ""|*EXTERNAL_STORAGE*|*READ_MEDIA_*)
                echo "Skipping broad storage permission (SAF is used): $UPPER_P"
                ;;
              *)
                PERMISSIONS="$PERMISSIONS $UPPER_P"
                ;;
            esac
          done
          
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Updating Android Manifest at $MANIFEST_PATH"
            # Wipe existing permissions to avoid duplicates
            sed -i '/android.permission./d' "$MANIFEST_PATH"
            
            # 3. Inject unique sorted permissions before <application>
            INJECT=""
            for P in $(echo $PERMISSIONS | tr ' ' '\n' | sort -u); do
              INJECT="${INJECT}    <uses-permission android:name=\"android.permission.${P}\" />\n"
            done
            
            sed -i "/<application/i $INJECT" "$MANIFEST_PATH"
            echo "Successfully updated manifest with: $PERMISSIONS"
          else
            echo "Skipping: Android manifest not found at $MANIFEST_PATH (Wait for Tauri to generate it)"
          fi

      - name: "Configure Release Build Signing with Debug Key"
        shell: python
        run: |
          import os
          path = "src-tauri/gen/android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if 'signingConfig = signingConfigs.getByName("debug")' not in content:
                  content = content.replace('getByName("release") {', 'getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")')
                  with open(path, "w") as f:
                      f.write(content)
                  print("Successfully patched build.gradle.kts to use debug signing key.")
              else:
                  print("build.gradle.kts was already patched.")
          else:
              print("Error: build.gradle.kts not found!")
              exit(1)

      - name: "Build Frontend"
        run: npm run build

      - name: "Build Android APK & AAB"
        run: npx tauri android build --apk --split-per-abi

      - name: "Get package version"
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "Add version to Android APK filenames"
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          while IFS= read -r -d '' apk; do
            dir=$(dirname "$apk")
            base=$(basename "$apk" .apk)
            if [[ "$base" != *"-v${VERSION}" ]]; then
              mv "$apk" "${dir}/${base}-v${VERSION}.apk"
            fi
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -print0)

      - name: "Upload Android Binaries to GitHub Draft Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.package-version.outputs.version }}"
          name: "Release v${{ steps.package-version.outputs.version }}"
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
